# Smoke adapter for short-explanation in ../cases.json and ../rubric.md.
id: explain-principle
name: Explain a design principle briefly
description: Check that explanation requests receive a direct, scoped answer.

inputs:
  prompt: Explain the Single Responsibility Principle in exactly two sentences. Do not ask follow-up questions.

expected:
  should_trigger: true

graders:
  - type: text
    name: keyword_smoke_single_responsibility
    config:
      regex_match:
        - "(?i)(reason to change|responsibility)"
