name: software-design-principles-eval
description: Discovery and keyword smoke checks; grade semantic outcomes separately with evals/rubric.md.
skill: software-design-principles
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  # Use the host default for smoke runs; pin --model for comparable evaluations.
  model: auto

metrics:
  - name: task_completion
    weight: 0.5
    threshold: 0.8
    description: Smoke checks only; this score does not establish semantic correctness.
  - name: trigger_accuracy
    weight: 0.5
    threshold: 0.8

tasks:
  - "evals/waza-tasks/*.yaml"
