# Project MCP configuration for local Windows Codex clients.
# Loaded only for trusted projects. Keep credentials in the host environment.
# Leave model, permissions, and sandbox settings to the user's configuration.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
required = true

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp?maxTokenBudget=5000"
required = false

[mcp_servers.chrome-devtools]
command = "cmd.exe"
args = [
    "/d",
    "/c",
    "npx",
    "--prefer-offline",
    "-y",
    "chrome-devtools-mcp@latest",
    "--headless",
    "--no-usage-statistics",
]
env_vars = [
    "SystemRoot",
    "PROGRAMFILES",
    "LOCALAPPDATA",
    "APPDATA",
    "USERPROFILE",
]
startup_timeout_sec = 60
required = false

[mcp_servers.fff]
command = "powershell.exe"
args = [
    "-NoLogo",
    "-NoProfile",
    "-NonInteractive",
    "-Command",
    "& (Join-Path $env:LOCALAPPDATA 'fff-mcp/bin/fff-mcp.exe'); exit $LASTEXITCODE",
]
env_vars = ["LOCALAPPDATA"]
required = true

[mcp_servers.codebase-memory-mcp]
command = "C:/Users/georg/AppData/Local/Programs/codebase-memory-mcp/codebase-memory-mcp.exe"
args = []
cwd = "C:/GK/Sources/csharp-test-automation-playwright"
env_vars = ["LOCALAPPDATA", "USERPROFILE"]
startup_timeout_sec = 60
required = true

[mcp_servers.fetch]
command = "uvx"
args = [
    "mcp-server-fetch",
    "--ignore-robots-txt",
    "--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36",
]
required = true

[mcp_servers.fetch.env]
PYTHONIOENCODING = "utf-8"

[mcp_servers.firecrawl]
command = "cmd.exe"
args = ["/d", "/c", "npx", "-y", "firecrawl-mcp"]
env_vars = [
    "FIRECRAWL_API_KEY",
    "SystemRoot",
    "PROGRAMFILES",
    "LOCALAPPDATA",
    "APPDATA",
    "USERPROFILE",
]
startup_timeout_sec = 60
required = true
