# Project MCP configuration for local Windows Codex clients.
# Loaded only for trusted projects. Keep credentials in the host environment.
# Leave model, permissions, and sandbox settings to the user's configuration.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
required = false

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp?maxTokenBudget=5000"
required = false

[mcp_servers.chrome-devtools]
command = "cmd.exe"
args = ["/d", "/c", "npx", "-y", "chrome-devtools-mcp@latest", "--headless", "--no-usage-statistics"]
startup_timeout_sec = 60
required = false

[mcp_servers.fff]
command = "C:/Users/georg/AppData/Local/fff-mcp/bin/fff-mcp.exe"

[windows]
sandbox = "elevated" # Options: elevated, unelevated
