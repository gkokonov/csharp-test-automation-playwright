name = "implementator"
description = "Implement authorized changes across the four solution projects and coordinate final review."
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
sandbox_mode = "danger-full-access"
developer_instructions = """
Use this role only when the user explicitly selects or requests custom Implementator. Read AGENTS.md, .agents/instructions/tooling.md (Task contract) and .agents/implementation/IMPLEMENTATION.md. Load .agents/skills/software-design-principles/SKILL.md for this role. Edit authorized paths, preserve baseline user changes, and follow .agents/review/REVIEW.md for independent review and repairs. Use tooling's Bounded research route for authorized research.
"""

# Tool-selection and cache rules are owned by .agents/instructions/tooling.md.
# Explicit transports avoid placeholder commands in standalone config layers.

[mcp_servers.fetch]
command = "uvx"
args = [
    "mcp-server-fetch",
    "--ignore-robots-txt",
    "--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36",
]
enabled = true
required = false
enabled_tools = ["fetch"]

[mcp_servers.fetch.env]
PYTHONIOENCODING = "utf-8"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
enabled = true
required = false
enabled_tools = ["resolve-library-id", "query-docs"]

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp?maxTokenBudget=5000"
enabled = true
required = false
enabled_tools = [
    "microsoft_docs_search",
    "microsoft_docs_fetch",
    "microsoft_code_sample_search",
]

[mcp_servers.fff]
command = "powershell.exe"
args = [
    "-NoLogo",
    "-NoProfile",
    "-NonInteractive",
    "-Command",
    "& (Join-Path $env:LOCALAPPDATA 'fff-mcp/bin/fff-mcp.exe'); exit $LASTEXITCODE",
]
env_vars = ["LOCALAPPDATA"]
enabled = true
required = false
enabled_tools = ["find_files", "grep", "multi_grep"]

[mcp_servers.codebase-memory-mcp]
command = "C:/Users/georg/AppData/Local/Programs/codebase-memory-mcp/codebase-memory-mcp.exe"
args = []
cwd = "C:/GK/Sources/csharp-test-automation-playwright"
env_vars = ["LOCALAPPDATA", "USERPROFILE"]
startup_timeout_sec = 60
enabled = true
required = false
enabled_tools = [
    "list_projects",
    "search_graph",
    "search_code",
    "trace_path",
    "get_architecture",
    "get_code_snippet",
    "get_file_outline",
    "get_graph_schema",
    "query_graph",
    "index_status",
    "check_index_coverage",
    "detect_changes",
    "compare_graphs",
    "index_repository",
]

[mcp_servers.chrome-devtools]
command = "cmd.exe"
args = [
    "/d",
    "/c",
    "npx",
    "--prefer-offline",
    "-y",
    "chrome-devtools-mcp@latest",
    "--headless",
    "--no-usage-statistics",
]
env_vars = [
    "SystemRoot",
    "PROGRAMFILES",
    "LOCALAPPDATA",
    "APPDATA",
    "USERPROFILE",
]
startup_timeout_sec = 60
enabled = true
required = false
enabled_tools = [
    "list_pages",
    "select_page",
    "list_console_messages",
    "get_console_message",
    "list_network_requests",
    "get_network_request",
    "take_snapshot",
    "take_screenshot",
    "get_css_styles",
    "performance_start_trace",
    "performance_stop_trace",
    "performance_analyze_insight",
    "take_heapsnapshot",
]
