name = "reviewer"
description = "Review requested changes and report evidence-based findings without changing reviewed source."
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
sandbox_mode = "danger-full-access"
developer_instructions = """
Read AGENTS.md, .agents/instructions/tooling.md (Task contract) and .agents/review/REVIEW.md. Load .agents/skills/open-code-review-delegate/SKILL.md. Compare scope, baseline, patches, and validation evidence; return findings and proposed repairs to the change owner. Use tools for inspection and owned scratch files only; do not change reviewed source or execute the skill's optional fix step. Report tool failures and cleanup results.
"""

# Tool-selection and cache rules are owned by .agents/instructions/tooling.md.
# Explicit transports avoid placeholder commands in standalone config layers.

[mcp_servers.fetch]
command = "uvx"
args = [
    "mcp-server-fetch",
    "--ignore-robots-txt",
    "--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36",
]
enabled = true
required = false
enabled_tools = ["fetch"]

[mcp_servers.fetch.env]
PYTHONIOENCODING = "utf-8"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
enabled = true
required = false
enabled_tools = ["resolve-library-id", "query-docs"]

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp?maxTokenBudget=5000"
enabled = true
required = false
enabled_tools = [
    "microsoft_docs_search",
    "microsoft_docs_fetch",
    "microsoft_code_sample_search",
]

[mcp_servers.fff]
command = "powershell.exe"
args = [
    "-NoLogo",
    "-NoProfile",
    "-NonInteractive",
    "-Command",
    "& (Join-Path $env:LOCALAPPDATA 'fff-mcp/bin/fff-mcp.exe'); exit $LASTEXITCODE",
]
env_vars = ["LOCALAPPDATA"]
enabled = true
required = false
enabled_tools = ["find_files", "grep", "multi_grep"]

[mcp_servers.codebase-memory-mcp]
command = "C:/Users/georg/AppData/Local/Programs/codebase-memory-mcp/codebase-memory-mcp.exe"
args = []
cwd = "C:/GK/Sources/csharp-test-automation-playwright"
env_vars = ["LOCALAPPDATA", "USERPROFILE"]
startup_timeout_sec = 60
enabled = true
required = false
enabled_tools = [
    "list_projects",
    "search_graph",
    "search_code",
    "trace_path",
    "get_architecture",
    "get_code_snippet",
    "get_file_outline",
    "get_graph_schema",
    "query_graph",
    "index_status",
    "check_index_coverage",
    "detect_changes",
    "compare_graphs",
]

[mcp_servers.chrome-devtools]
command = "cmd.exe"
args = [
    "/d",
    "/c",
    "npx",
    "--prefer-offline",
    "-y",
    "chrome-devtools-mcp@latest",
    "--headless",
    "--no-usage-statistics",
]
env_vars = [
    "SystemRoot",
    "PROGRAMFILES",
    "LOCALAPPDATA",
    "APPDATA",
    "USERPROFILE",
]
startup_timeout_sec = 60
enabled = false
required = false

[mcp_servers.firecrawl]
command = "cmd.exe"
args = [
    "/d",
    "/c",
    "npx",
    "-y",
    "firecrawl-mcp",
]
env_vars = [
    "FIRECRAWL_API_KEY",
    "SystemRoot",
    "PROGRAMFILES",
    "LOCALAPPDATA",
    "APPDATA",
    "USERPROFILE",
]
startup_timeout_sec = 60
enabled = true
required = false
enabled_tools = [
    "firecrawl_agent",
    "firecrawl_agent_status",
    "firecrawl_check_crawl_status",
    "firecrawl_crawl",
    "firecrawl_credit_usage",
    "firecrawl_developer_search",
    "firecrawl_feedback",
    "firecrawl_find_tools",
    "firecrawl_gov_search",
    "firecrawl_interact",
    "firecrawl_interact_stop",
    "firecrawl_map",
    "firecrawl_monitor_check",
    "firecrawl_monitor_checks",
    "firecrawl_monitor_create",
    "firecrawl_monitor_delete",
    "firecrawl_monitor_get",
    "firecrawl_monitor_list",
    "firecrawl_monitor_run",
    "firecrawl_monitor_update",
    "firecrawl_parse",
    "firecrawl_research_inspect_paper",
    "firecrawl_research_read_paper",
    "firecrawl_research_related_papers",
    "firecrawl_research_search_papers",
    "firecrawl_scrape",
    "firecrawl_search",
    "firecrawl_search_feedback",
]
